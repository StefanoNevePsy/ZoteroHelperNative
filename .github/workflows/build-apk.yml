name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the build still running for it
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only used to attach the APK to a release on v* tags

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :app:assembleDebug -PversionCode=${{ github.run_number }} --stacktrace

      - name: Name the APK
        id: apk
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          name="ZoteroHelperNative-${ref}-build${{ github.run_number }}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### APK pronto: \`$name\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Scaricalo dagli *Artifacts* di questa esecuzione e installalo sul tablet." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
